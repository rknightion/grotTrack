name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@f32275a4a7641f34db5cb005d270db961b54a680 # v1.25.3
    with:
      # Swift omitted: CodeQL Swift requires a real Xcode build that autobuild
      # can't perform headlessly here. JS/TS + actions cover the rest.
      languages: '[{"language":"javascript-typescript","build-mode":"none"},{"language":"actions","build-mode":"none"}]'