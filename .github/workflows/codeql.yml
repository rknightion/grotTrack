name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@414aeb877c157ce559592551b222bbd90db61ce7 # v1.9.9
    with:
      # Swift omitted: CodeQL Swift requires a real Xcode build that autobuild
      # can't perform headlessly here. JS/TS + actions cover the rest.
      languages: '[{"language":"javascript-typescript","build-mode":"none"},{"language":"actions","build-mode":"none"}]'