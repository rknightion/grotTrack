name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@9c3981da69a2aa4eecd99e5740335219fd8c6a00 # v1.9.10
    with:
      # Swift omitted: CodeQL Swift requires a real Xcode build that autobuild
      # can't perform headlessly here. JS/TS + actions cover the rest.
      languages: '[{"language":"javascript-typescript","build-mode":"none"},{"language":"actions","build-mode":"none"}]'